<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/wbc-icon-192.png" />
    <link rel="apple-touch-icon" href="/wbc-icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Single, consistent viewport policy (no viewport-fit=cover). This matches
         the in-app JS that manages the viewport, so iOS does NOT flip cover ->
         no-cover after first paint. Letting iOS own the safe areas is what keeps
         the header from being clipped or over-padded. -->
    <!-- Pinch-to-zoom stays available: this app is read outdoors, in sun, at
         arm's length. Focus-zoom on inputs is prevented by the 16px rule in
         App.jsx, which removes the trigger rather than banning the gesture.
         `maximum-scale`/`user-scalable` were what banned it and are gone.

         viewport-fit IS STILL ABSENT, and that is the note above, not an
         omission. Adding cover makes iOS report a real safe-area-inset-bottom,
         the bottom nav pads itself by --sab, and the whole bar lifts off the
         bottom of the screen. Learned twice now. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ── The app font, served from this origin ─────────────────────
         It used to come from fonts.googleapis.com, and the bytes were never
         the problem: Montserrat ships as ONE variable woff2 covering the whole
         300–900 axis, so asking for seven weights and asking for one fetched
         exactly the same 37KB file. What it cost was the ROUND TRIPS. A
         render-blocking stylesheet on a second origin, naming files on a
         third, is a DNS lookup, a TCP handshake and a TLS negotiation — twice,
         before a single glyph can be drawn. The two preconnects that used to
         sit here were an admission of that, and they only ever hid part of it.

         Same origin, the @font-face rules inline below (no stylesheet request
         at all) and the file preloaded above, so the browser's preload scanner
         starts fetching it from the first bytes of this document rather than
         after a CSS round trip tells it to.

         Declared HERE rather than in a React screen's own <link>: portaled
         modals attach to <body>, outside every one of those screens, so this
         is the only place they can inherit a font from.

         Montserrat is SIL OFL 1.1 — see public/fonts/OFL.txt, which ships
         alongside the files as that licence requires. -->
    <link rel="preload" href="/fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The mark on the splash below. Preloaded rather than left to be
         discovered, because the splash is the FIRST content on screen and the
         browser should be fetching it while it is still parsing this file. -->
    <link rel="preload" href="/wbc-logo.webp" as="image" />
    <style>
      /* The two subsets Google served, kept apart for the same reason it kept
         them apart: latin-ext is twice the size of latin and is only fetched
         if something on screen actually needs a character in its range. */
      @font-face {
        font-family: 'Montserrat';
        font-style: normal;
        font-weight: 300 900;
        font-display: swap;
        src: url('/fonts/montserrat-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Montserrat';
        font-style: normal;
        font-weight: 300 900;
        font-display: swap;
        src: url('/fonts/montserrat-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
    </style>
    <meta name="theme-color" content="#080f1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Opaque dark status bar (white text), content sits BELOW it. With no
         viewport-fit=cover this avoids the under-status-bar overlay entirely. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="WBC 2026" />
    <title>WBC 2026</title>
    <script>
      // ── Theme, before first paint ──────────────────────────────────
      // The palette lives in src/theme.js, but this runs before any of it is
      // parsed — and a light-mode user reloading onto a near-black page that
      // flips white a beat later is the whole reason to do it here. Same
      // storage key theme.js reads; the two backgrounds are the two `bg`
      // tokens, and theme.test.js asserts they still match.
      (function () {
        var t = 'dark';
        try { var v = localStorage.getItem('wbc_theme'); if (v === 'light' || v === 'dark') t = v; } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
        var bg = t === 'light' ? '#f2f5f9' : '#080f1a';
        document.documentElement.style.background = bg;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', bg);
      })();
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* Which way round the browser paints what IT owns — scrollbars, the
         caret, form-control internals, Android's auto-darkening. Follows the
         app's theme rather than the device's. See the note in src/index.css;
         both copies exist so the first paint and the mounted app agree. */
      :root { color-scheme: dark; }
      html[data-theme="light"] { color-scheme: light; }
      /* Must match K.bg in src/theme.js and the background in src/index.css.
         This is the colour on screen from the first paint until React mounts;
         if it differs from the app's own background the whole screen changes
         shade the moment the app appears. Three values used to disagree here
         (#080f1e, #030810, K.bg) and each hand-off was a visible flash. */
      /* No background here — the script above paints it from the stored theme
         before this stylesheet can matter, and a hardcoded one would flash. */
      html, body, #root { height: 100%; overflow: hidden; }
      /* Mirrors src/index.css — see the note there. Both copies exist so the
         first paint and the mounted app agree; they have to move together. */
      body { font-family: 'Montserrat', sans-serif; text-transform: uppercase; }
      input, button, textarea, select { font-family: inherit; text-transform: inherit; }
      input:not([type="button"]):not([type="submit"]):not([type="reset"]),
      textarea { text-transform: none; }

      /* ── The splash, and why it is in this file ────────────────────
         Until React mounts there was nothing on screen at all: #root was
         empty, so the first thing anybody saw was a flat background, and it
         stayed flat until ~250KB of JavaScript had been fetched, parsed and
         run. The app HAS a loading screen — the pulsing mark it shows while
         auth answers — but it lives inside the bundle, which means it can
         only appear after the wait it exists to explain is over.

         This is that same screen, hand-written, weighing nothing, painted
         from the first bytes of the document. The gradient, the mark, its
         height and its pulse all match authHoldScreen in App.jsx, so the
         hand-off when React mounts is invisible — the same picture, drawn by
         something else.

         It removes ITSELF: createRoot().render() clears everything already
         inside its container, so the splash is gone the moment React paints.
         Nothing has to remember to take it away.

         The two gradients are entranceBg() from theme.js, resolved. Held
         honest by theme.test.js, which fails if the palette moves and this
         does not. */
      #wbc-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at 20% 50%, #0d1f3c 0%, #080f1a 70%);
      }
      html[data-theme="light"] #wbc-splash {
        background: radial-gradient(ellipse at 20% 50%, #e2eaf5 0%, #f2f5f9 70%);
      }
      #wbc-splash img {
        height: 72px;
        width: auto;
        opacity: 0.85;
        filter: drop-shadow(0 4px 16px rgba(34,211,167,0.3));
        animation: wbcSplashPulse 1.5s ease-in-out infinite;
      }
      @keyframes wbcSplashPulse { 0%, 100% { opacity: 0.85; } 50% { opacity: 0.4; } }
      /* Shown only if the bundle never arrives — see the timer below. A mark
         that pulses forever reads as "working", which is the one thing it is
         not doing, and this app is opened in places with no signal. */
      #wbc-splash-late {
        position: absolute;
        left: 20px; right: 20px; bottom: 15%;
        text-align: center;
        font-size: 12px;
        letter-spacing: 0.04em;
        color: #7b8eae;
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #wbc-splash img { animation: none; }
      }
    </style>
    <script>
      // Is a text field focused — i.e. is an on-screen keyboard up? See the
      // shrink guard in setAppHeight. Mirrors App.jsx.
      function wbcIsEditing() {
        var el = document.activeElement;
        if (!el || el === document.body) return false;
        if (el.isContentEditable) return true;
        return /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName || '');
      }

      function setAppHeight(allowShrink) {
        // GUARD: on iOS PWA cold-reopen/resume, window.innerHeight is briefly 0
        // (or an unstable tiny value) during the launch transition. Writing that
        // into --app-height collapses the fixed-height app container to a blank
        // dark screen (the "flash then dark" bug). Ignore any non-sane value and
        // keep the last good one (or the CSS 100dvh fallback). Mirrors App.jsx.
        var h = window.innerHeight;
        if (!(h > 100)) return;
        // KEYBOARD GUARD: opening the on-screen keyboard shrinks innerHeight and
        // fires resize. Believing it collapses the fixed-height app container —
        // the bottom nav rides up into the middle of the screen with a black band
        // under it — and the grow-back resize does NOT reliably arrive when the
        // keyboard closes (dismissing it by unmounting the field, e.g. saving a
        // course name, is the case that strands it), so the wrong height sticks.
        // While a field has focus --app-height may grow but never shrink. A real
        // shrink while typing (rotation) still lands via the orientation handler
        // and the re-measure after blur, both of which pass allowShrink.
        var prev = parseFloat(document.documentElement.style.getPropertyValue('--app-height')) || 0;
        if (!allowShrink && prev && h < prev && wbcIsEditing()) return;
        document.documentElement.style.setProperty('--app-height', h + 'px');
      }

      // iOS scrolls the DOCUMENT to reveal a focused field even though html/body
      // are overflow:hidden, and does not always scroll back when the keyboard
      // goes — which lifts the whole app off the bottom of the screen and looks
      // just like the collapse above. Nothing here scrolls the document (every
      // scroller is an inner pane), so pinning it back to 0 is always safe.
      function wbcUnscroll() {
        if (wbcIsEditing()) return; // don't fight iOS while it reveals the field
        try {
          window.scrollTo(0, 0);
          document.body.scrollTop = 0;
          document.documentElement.scrollTop = 0;
        } catch (e) {}
      }

      function wbcSettle(allowShrink) { setAppHeight(allowShrink); wbcUnscroll(); }

      // Set immediately on load
      setAppHeight();

      // In standalone PWA mode on iOS, the layout settles after a short delay
      if (navigator.standalone) {
        setTimeout(setAppHeight, 100);
        setTimeout(setAppHeight, 300);
        setTimeout(setAppHeight, 600);
      }

      window.addEventListener('resize', function() { wbcSettle(false); });
      window.addEventListener('orientationchange', function() {
        setTimeout(function() { wbcSettle(true); }, 200);
        setTimeout(function() { wbcSettle(true); }, 500);
      });

      // Keyboard going away: re-measure once it has finished animating out, and
      // undo any document scroll iOS left behind. Deliberately NOT allowShrink —
      // moving between two fields also fires focusout with the keyboard still up,
      // and there the guard (which only blocks while something is focused) is
      // exactly what we want.
      document.addEventListener('focusout', function() {
        setTimeout(function() { wbcSettle(false); }, 50);
        setTimeout(function() { wbcSettle(false); }, 300);
        setTimeout(function() { wbcSettle(false); }, 700);
      });

      // Also re-measure when the page becomes visible (e.g. switching back to the app)
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          setTimeout(function() { wbcSettle(false); }, 100);
        }
      });
    </script>
  </head>
  <body>
    <div id="root">
      <!-- See the note on #wbc-splash above. This is inside #root on purpose:
           React clears its container on the first render, so the splash is
           removed by the thing replacing it and there is no teardown to get
           wrong. `alt` is empty because it is decoration — the screen it
           stands in for has no text either. -->
      <div id="wbc-splash">
        <img src="/wbc-logo.webp" alt="" />
        <div id="wbc-splash-late">Still loading — check your signal</div>
      </div>
    </div>
    <script>
      // If the bundle has not replaced the splash after twelve seconds, say
      // so. Long enough that a slow-but-working load never sees it; short
      // enough to be useful to somebody holding a phone that is not going to
      // finish. Cheap to be wrong in either direction — it is one line of
      // grey text, and React blows the whole splash away regardless.
      setTimeout(function () {
        var late = document.getElementById('wbc-splash-late');
        if (late && document.getElementById('wbc-splash')) late.style.display = 'block';
      }, 12000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
